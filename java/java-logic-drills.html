<script>
const DATA = [
{
  id:"TC-01", title:"Find Missing Numbers in an Array", pattern:"Array", difficulty:"Medium",
  problem:"Given an array of size n whose values are meant to range from 1 to n but some values are missing (and others may repeat), return every missing number.",
  approach:"Use each value as a pointer into the array itself: for value v, negate the element at index v-1 to mark 'v was seen'. After one pass, any index still holding a positive number means (index+1) never showed up. This gets you O(n) time with O(1) extra space (besides the output list) — a strong follow-up to a naive HashSet solution.",
  code:"import java.util.*;\n\npublic class MissingNumbers {\n    public static List<Integer> findMissing(int[] nums) {\n        int n = nums.length;\n        List<Integer> missing = new ArrayList<>();\n\n        // Step 1: mark visited indices by negating nums[value - 1]\n        for (int num : nums) {\n            int index = Math.abs(num) - 1;\n            if (nums[index] > 0) {\n                nums[index] = -nums[index];\n            }\n        }\n\n        // Step 2: index still positive => (index + 1) never appeared\n        for (int i = 0; i < n; i++) {\n            if (nums[i] > 0) {\n                missing.add(i + 1);\n            }\n        }\n\n        // Step 3: restore the original array (good practice, avoids side effects)\n        for (int i = 0; i < n; i++) {\n            nums[i] = Math.abs(nums[i]);\n        }\n        return missing;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {4, 3, 2, 7, 8, 2, 3, 1};\n        System.out.println(findMissing(nums)); // [5, 6]\n    }\n}",
  time:"O(n)", space:"O(1) extra (excluding output)",
  edges:[
    "handlesEmptyArray() — returns empty list, no exceptions",
    "handlesNoMissingValues() — every index gets negated, result is empty",
    "handlesAllDuplicatesOfOne() — e.g. [1,1,1] should not crash on repeated negation",
    "handlesUnsortedInput() — algorithm doesn't depend on order"
  ],
  tips:[
    "Interviewers use this to test whether you reach for O(n) extra space (HashSet) by default or can push to O(1) — mention both, then optimize.",
    "Say out loud that you're mutating the input array and restoring it — that's the kind of side-effect awareness a reviewer wants from an SDET.",
    "Know the sibling problem: 'find the single missing number' solved via sum formula n*(n+1)/2 minus actual sum."
  ]
},
{
  id:"TC-02", title:"Move All Zeros to the End Without Changing Order", pattern:"Two-Pointer", difficulty:"Easy",
  problem:"Given an array of integers, move all zeros to the end while keeping the relative order of the non-zero elements, in-place.",
  approach:"Two-pointer / write-pointer technique: walk the array once, and every time you see a non-zero value, write it to the next open slot. At the end, fill the remaining slots with zero. This is a stable partition done in a single O(n) pass.",
  code:"public class MoveZeros {\n    public static void moveZeros(int[] arr) {\n        int insertPos = 0;\n\n        for (int num : arr) {\n            if (num != 0) {\n                arr[insertPos++] = num;\n            }\n        }\n        while (insertPos < arr.length) {\n            arr[insertPos++] = 0;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] arr = {0, 1, 0, 3, 12};\n        moveZeros(arr);\n        System.out.println(java.util.Arrays.toString(arr)); // [1, 3, 12, 0, 0]\n    }\n}",
  time:"O(n)", space:"O(1)",
  edges:[
    "handlesAllZeros() — array unchanged in content, all zeros stay",
    "handlesNoZeros() — array unchanged, no unnecessary writes past insertPos",
    "handlesSingleElementArray()",
    "handlesNegativeNumbers() — only literal 0 should move, not negatives"
  ],
  tips:[
    "This is the most common 'write it live' warm-up question — practice it until it's muscle memory, interviewers expect under 3 minutes.",
    "Mention the swap-based variant (swap arr[insertPos] and arr[i]) as an alternative that avoids a second pass, and discuss the trade-off in extra writes."
  ]
},
{
  id:"TC-03", title:"Check Whether Brackets Are Balanced", pattern:"Stack", difficulty:"Easy",
  problem:"Given a string containing (){}[] characters (possibly mixed with other characters), determine whether every opening bracket has a matching, correctly nested closing bracket.",
  approach:"Classic stack problem: push opening brackets, and on a closing bracket, pop and check it matches. If the stack is empty when you need to pop, or isn't empty at the end, the string is unbalanced.",
  code:"import java.util.*;\n\npublic class BalancedBrackets {\n    public static boolean isBalanced(String s) {\n        Deque<Character> stack = new ArrayDeque<>();\n        Map<Character, Character> pairs = Map.of(')', '(', ']', '[', '}', '{');\n\n        for (char c : s.toCharArray()) {\n            if (c == '(' || c == '[' || c == '{') {\n                stack.push(c);\n            } else if (pairs.containsKey(c)) {\n                if (stack.isEmpty() || stack.pop() != pairs.get(c)) {\n                    return false;\n                }\n            }\n        }\n        return stack.isEmpty();\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isBalanced(\"{[()()]}\")); // true\n        System.out.println(isBalanced(\"{[(])}\"));    // false\n    }\n}",
  time:"O(n)", space:"O(n) worst case (all opening brackets)",
  edges:[
    "handlesEmptyString() — vacuously balanced, returns true",
    "handlesOnlyClosingBrackets() — stack.isEmpty() guard prevents pop-on-empty crash",
    "handlesUnmatchedOpeningBrackets() — stack non-empty at end returns false",
    "handlesNonBracketCharacters() — mixed text like 'a(b)c' is ignored correctly"
  ],
  tips:[
    "This is the canonical 'do you know Deque over Stack class' check — Java's legacy Stack extends Vector and is synchronized/slower; ArrayDeque is the modern idiomatic choice.",
    "Be ready for the follow-up: 'return the index of the first mismatch' — track index alongside character.",
    "Map.of() is immutable and fine here since we only read from it."
  ]
},
{
  id:"TC-04", title:"Find the First Non-Repeating Character", pattern:"Hashing", difficulty:"Easy",
  problem:"Given a string, return the first character that appears exactly once, in left-to-right order.",
  approach:"Two passes: build a frequency map (LinkedHashMap to remember insertion order), then walk the string again to find the first key with count 1. A LinkedHashMap avoids needing a separate ordered structure.",
  code:"import java.util.*;\n\npublic class FirstNonRepeatingChar {\n    public static Character firstNonRepeating(String s) {\n        Map<Character, Integer> counts = new LinkedHashMap<>();\n        for (char c : s.toCharArray()) {\n            counts.merge(c, 1, Integer::sum);\n        }\n        for (Map.Entry<Character, Integer> entry : counts.entrySet()) {\n            if (entry.getValue() == 1) {\n                return entry.getKey();\n            }\n        }\n        return null; // no non-repeating character found\n    }\n\n    public static void main(String[] args) {\n        System.out.println(firstNonRepeating(\"swiss\")); // 'w'\n    }\n}",
  time:"O(n)", space:"O(1) — bounded by charset size",
  edges:[
    "handlesEmptyString() — returns null, caller must null-check",
    "handlesAllCharactersRepeating() — returns null, e.g. 'aabbcc'",
    "handlesSingleCharacterString() — that character is the answer",
    "handlesCaseSensitivity() — 'A' and 'a' are treated as distinct keys"
  ],
  tips:[
    "Returning a boxed Character (not char) so null is a valid 'not found' signal is worth explaining unprompted — shows API design awareness.",
    "If asked to avoid a second pass, mention iterating counts.entrySet() only works because LinkedHashMap preserves insertion order — a plain HashMap would not guarantee this."
  ]
},
{
  id:"TC-05", title:"Count Frequency of Each Character", pattern:"Hashing", difficulty:"Easy",
  problem:"Given a string, return a map of each character to how many times it occurs.",
  approach:"Single pass with Map.merge — the bread-and-butter counting pattern that underlies half the questions on this list.",
  code:"import java.util.*;\n\npublic class CharFrequency {\n    public static Map<Character, Integer> countFrequency(String s) {\n        Map<Character, Integer> freq = new LinkedHashMap<>();\n        for (char c : s.toCharArray()) {\n            freq.merge(c, 1, Integer::sum);\n        }\n        return freq;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(countFrequency(\"bookkeeper\"));\n        // {b=1, o=2, k=2, e=3, p=1, r=1}\n    }\n}",
  time:"O(n)", space:"O(k) where k = distinct characters",
  edges:[
    "handlesEmptyString() — returns empty map",
    "handlesWhitespaceAndPunctuation() — counted like any other character unless explicitly stripped",
    "handlesUnicodeOrEmoji() — toCharArray() splits by UTF-16 code unit, surrogate pairs can split incorrectly — worth flagging",
    "handlesLargeInput() — verify no overflow for very long strings (Integer is fine in practice)"
  ],
  tips:[
    "This exact snippet is a building block — reuse it mentally for anagrams, RLE, and first-non-repeating questions rather than re-deriving it each time.",
    "If asked for a case-insensitive version, normalize with Character.toLowerCase(c) before merging, and say so explicitly."
  ]
},
{
  id:"TC-06", title:"Calculate Sum by Grouping Keys", pattern:"Hashing", difficulty:"Easy",
  problem:"Given a list of key-value pairs (e.g. transaction category and amount), return the total amount per key.",
  approach:"Same merge pattern as frequency counting, but summing the paired value instead of a constant 1 — this is effectively a SQL 'GROUP BY key SUM(value)' done in memory.",
  code:"import java.util.*;\n\npublic class SumByKey {\n    public static Map<String, Integer> groupSum(List<Map.Entry<String, Integer>> entries) {\n        Map<String, Integer> totals = new LinkedHashMap<>();\n        for (Map.Entry<String, Integer> entry : entries) {\n            totals.merge(entry.getKey(), entry.getValue(), Integer::sum);\n        }\n        return totals;\n    }\n\n    public static void main(String[] args) {\n        List<Map.Entry<String, Integer>> data = List.of(\n            Map.entry(\"apple\", 10),\n            Map.entry(\"banana\", 5),\n            Map.entry(\"apple\", 7)\n        );\n        System.out.println(groupSum(data)); // {apple=17, banana=5}\n    }\n}",
  time:"O(n)", space:"O(k) distinct keys",
  edges:[
    "handlesEmptyList() — returns empty map",
    "handlesSingleKeyRepeatedManyTimes() — sum accumulates correctly, no overwrite bug",
    "handlesNegativeValues() — e.g. refunds/debits reducing a running total",
    "handlesIntegerOverflow() — swap to long if amounts can be large, mention this proactively"
  ],
  tips:[
    "This maps directly to real BFSI/GMF-style test data — grouping transactions by account or category is a very plausible on-the-job utility, not just a toy problem.",
    "If interviewers hand you Stream API territory, know the one-liner too: entries.stream().collect(Collectors.groupingBy(Map.Entry::getKey, Collectors.summingInt(Map.Entry::getValue)))."
  ]
},
{
  id:"TC-07", title:"Reverse Alternate Words in a Sentence", pattern:"String", difficulty:"Medium",
  problem:"Given a sentence, reverse the characters of every alternate word (the 2nd, 4th, 6th…) while leaving the others and the word order untouched.",
  approach:"Split on spaces, and for words at odd indices, reverse the characters with StringBuilder.reverse(). Rebuild the sentence with single spaces. State this interpretation explicitly to the interviewer since 'reverse alternate words' is genuinely ambiguous — it could also mean reversing word order at alternate positions.",
  code:"public class ReverseAlternateWords {\n    public static String reverseAlternate(String sentence) {\n        String[] words = sentence.split(\" \");\n        StringBuilder result = new StringBuilder();\n\n        for (int i = 0; i < words.length; i++) {\n            String word = words[i];\n            if (i % 2 == 1) { // reverse the 2nd, 4th, 6th... word\n                word = new StringBuilder(word).reverse().toString();\n            }\n            result.append(word);\n            if (i != words.length - 1) result.append(\" \");\n        }\n        return result.toString();\n    }\n\n    public static void main(String[] args) {\n        System.out.println(reverseAlternate(\"This is a QA test\"));\n        // \"This si a AQ test\"\n    }\n}",
  time:"O(n) total characters", space:"O(n) for the rebuilt string",
  edges:[
    "handlesSingleWordSentence() — no alternate word exists, returned unchanged",

];

const PATTERNS = ["All", ...Array.from(new Set(DATA.map(d => d.pattern)))];
let activeFilter = "All";
let activeSearch = "";
let activeId = DATA[0].id;
let reviewed = new Set();

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  PATTERNS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (p === activeFilter ? ' active' : '');
    btn.textContent = p;
    btn.onclick = () => { activeFilter = p; renderFilters(); renderList(); };
    wrap.appendChild(btn);
  });
}

function filteredData(){
  return DATA.filter(d => {
    const matchesFilter = activeFilter === "All" || d.pattern === activeFilter;
    const q = activeSearch.toLowerCase();
    const matchesSearch = !q || d.title.toLowerCase().includes(q) || d.pattern.toLowerCase().includes(q) || d.id.toLowerCase().includes(q);
    return matchesFilter && matchesSearch;
  });
}

function renderProgress(){
  const pct = Math.round((reviewed.size / DATA.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = reviewed.size + '/' + DATA.length;
}

function renderList(){
  const list = document.getElementById('qList');
  list.innerHTML = '';
  const items = filteredData();
  if (items.length === 0){
    list.innerHTML = '<div style="padding:20px 10px;color:var(--text-faint);font-size:13px;">No matches.</div>';
    return;
  }
  items.forEach(d => {
    const el = document.createElement('div');
    el.className = 'q-item' + (d.id === activeId ? ' active' : '');
    el.innerHTML = `
      <span class="q-id">${d.id}</span>
      <span class="q-check ${reviewed.has(d.id) ? 'done' : ''}"></span>
      <span class="q-title">${d.title}</span>
      <span class="q-diff ${d.difficulty}">${d.difficulty}</span>
    `;
    el.onclick = () => { activeId = d.id; renderList(); renderMain(); if(window.innerWidth<=860){document.getElementById('sidebar').classList.remove('open');} };
    list.appendChild(el);
  });
}

function renderMain(){
  const d = DATA.find(x => x.id === activeId);
  const main = document.getElementById('main');
  if (!d){ main.innerHTML = ''; return; }

  const edgeItems = d.edges.map(e => {
    const parts = e.split(" — ");
    const fn = parts[0];
    const desc = parts.slice(1).join(" — ");
    return `<li class="assert-item"><span class="mark">✓</span><span><span class="fn">${fn}</span>${desc ? ' <span class="desc">— ' + desc + '</span>' : ''}</span></li>`;
  }).join('');

  main.innerHTML = `
    <div class="detail-header">
      <div>
        <p class="detail-id">${d.id}</p>
        <h2>${d.title}</h2>
        <div class="tag-row">
          <span class="tag">${d.pattern}</span>
          <span class="tag">${d.difficulty}</span>
        </div>
      </div>
      <button class="mark-btn ${reviewed.has(d.id) ? 'done' : ''}" id="markBtn">${reviewed.has(d.id) ? '✓ Reviewed' : 'Mark reviewed'}</button>
    </div>

    <section>
      <p class="section-label">Problem</p>
      <p class="prose">${d.problem}</p>
    </section>

    <section>
      <p class="section-label">Approach</p>
      <p class="prose">${d.approach}</p>
    </section>

    <section>
      <p class="section-label">Java Solution</p>
      <pre><code class="language-java">${d.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>
    </section>

    <section>
      <div class="stat-row">
        <div class="stat-card"><p class="k">Time Complexity</p><p class="v">${d.time}</p></div>
        <div class="stat-card"><p class="k">Space Complexity</p><p class="v">${d.space}</p></div>
      </div>
    </section>

    <section>
      <p class="section-label">Edge Cases — Test Checklist</p>
      <ul class="assert-list">${edgeItems}</ul>
    </section>

    <section>
      <p class="section-label">Interview Tips</p>
      <div class="tips-box"><ul>${d.tips.map(t => `<li>${t}</li>`).join('')}</ul></div>
    </section>
  `;

  document.getElementById('markBtn').onclick = () => {
    if (reviewed.has(d.id)) reviewed.delete(d.id); else reviewed.add(d.id);
    renderProgress(); renderList(); renderMain();
  };

  if (window.hljs) hljs.highlightAll();
  main.scrollTop = 0;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  activeSearch = e.target.value;
  renderList();
});

document.getElementById('toggleBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

renderFilters();
renderList();
renderProgress();
renderMain();
</script>
</body>
</html>
